<header class="page-header" id="top-element">
    <div class="catalog-menu">
        <div class="catalog-menu__content">
            <div class="catalog-menu__row" id="catalog_list">


            </div>
<!--            <div class="catalog-menu__right">-->
<!--                <a href="/page_selection" class="catalog-menu__button button button_accent">Подбор запчастей</a>-->
<!--                <a href="#" class="catalog-menu__selection-link selection-link">-->
<!--                    <img src="img/links/1.png" alt="">-->
<!--                    <span class="selection-link__title">Подбор шин и дисков</span>-->
<!--                </a>-->
<!--                <a href="#" class="catalog-menu__selection-link selection-link">-->
<!--                    <img src="img/links/2.png" alt="">-->
<!--                    <span class="selection-link__title">Подбор АКБ</span>-->
<!--                </a>-->
<!--            </div>-->
        </div>
    </div>
    <div class="page-content">
        <div class="page-header__content">
            <div class="page-header__left">
                <button class="button-menu">
                    <span class="button-menu__decor"></span>
                </button>
                <a href="/" class="page-header__logo logo">
                    <div class="logo__text">Автозапчасти</div>
                    <img src="img/site-logo.png" alt="#">
                </a>
                <div class="page-header__column">
                    <div class="page-header__address page-address" data-location-header tabindex="0">
                        <address class="page-address__current" data-location-change>Не определен</address>
                        <div class="page-address__drop">
                            <div class="page-address__row">
                                <div class="page-address__left">
                                    Ваш регион —
                                </div>
                                <div class="page-address__right">
                                    <span class="page-address__current-city"></span>
                                    <div class="page-address__buttons">

                                    </div>
                                </div>
                            </div>
                            <div class="page-address__pick pick-address">
                                <span class="pick-address__title">Выберите регион:</span>
                                <div class="pick-address__search entry-input entry-input_search">
                                    <div class="entry-input__icon">
                                        <svg>
                                            <use xlink:href="img/svg/sprite.svg#search"></use>
                                        </svg>
                                    </div>
                                    <div>
                                        <input type="text" value="test" class="pick-address__input entry-input__field" name="city-search" placeholder="Местоположение">
                                    </div>
                                </div>
                                <ul class="pick-address__list">
                                </ul>
                            </div>
                        </div>
                    </div>
                    <button class="button button_accent button-catalog">
                        <span class="button-catalog__decor"></span>
                        Каталог
                    </button>
                </div>
            </div>
            <div class="page-header__right">
                <div class="page-header__row page-header__row-top">
                    <a class="page-tel page-header__tel" href="tel:79592100936">7-959-210-09-36</a>
                    <nav class="page-header__nav page-nav">

                    </nav>
                    <div class="page-header__user-nav user-nav">
                        <div class="user-nav__item" data-user-sign>

                        </div>
                        <div class="user-nav__item">
                            @@if (active === 'active_cart') {
                                <div class="user-nav__link user-nav__link_cart user-nav__empty" data-user-cart>
                                    <svg>
                                        <use xlink:href="img/svg/sprite.svg#cart"></use>
                                    </svg>
                                    <span class="user-nav__span">Корзина</span>
                                </div>
                            }
                            @@if (active !== 'active_cart') {
                            <a href="/cart" class="user-nav__link user-nav__link_cart" data-user-cart>
                                <svg>
                                    <use xlink:href="img/svg/sprite.svg#cart"></use>
                                </svg>
                                <span class="user-nav__span">Корзина</span>
                            </a>
                            }
                        </div>
                    </div>
                </div>
                <div class="page-header__row page-header__row_bottom">
                    <div class="page-header__search-wrapper page-search entry-input entry-input_search" id="page-search" tab-index="0">
                        <div class="page-search__form">
                            <button class="page-search__icon">
                                <svg>
                                    <use xlink:href="img/svg/sprite.svg#search"></use>
                                </svg>
                            </button>
                            <input type="text" class="entry-input__field page-search__field" name="site-search" id="site-search" placeholder="Что ищите?" autocomplete="off">
                            <button class="page-search__button button button_accent" tabindex="0">
                                <svg>
                                    <use xlink:href="img/svg/sprite.svg#search"></use>
                                </svg>
                                Искать
                            </button>
                            <button class="page-search__loader">
                                <span class="loader"></span>
                            </button>
                        </div>
                        <div class="page-search__complete">
                            <div class="search-list" data-header-searchlist>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="page-header__bottom">
        <div class="page-content">

        </div>
    </div>
</header>
